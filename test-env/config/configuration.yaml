# Home Assistant configuration of the Switch Timer TEST ENVIRONMENT (scripts/test-env).
# Copied into the ha-switch-timer-test-config volume on first start. Not for real installs.

homeassistant:
  name: Switch Timer test
  auth_providers:
    # TEST ENVIRONMENT ONLY: log in without a password from this machine.
    # Listed first so the login page uses it (others still get the password form below).
    # The port is published on 127.0.0.1 only (docker-compose.yml), so other devices
    # can't reach this HA. Docker Desktop and Docker on Linux forward localhost
    # connections from a bridge gateway address, hence the private Docker ranges.
    # Never copy this into a real Home Assistant configuration.
    - type: trusted_networks
      trusted_networks:
        - 127.0.0.1
        - ::1
        - 172.16.0.0/12 # Docker bridge networks
        - 192.168.65.0/24 # Docker Desktop (Windows/macOS) forwarding range
      allow_bypass_login: true
    - type: homeassistant

default_config:

logger:
  default: info
  logs:
    custom_components.switch_timer: debug

# Test devices to control with Switch Timer.
input_boolean:
  test_pump:
    name: Test pump state
    icon: mdi:water-pump
  test_fan:
    name: Test fan state
    icon: mdi:fan

template:
  - switch:
      - name: Test pump
        unique_id: switch_timer_test_pump
        state: "{{ is_state('input_boolean.test_pump', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_pump
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.test_pump
  - fan:
      - name: Test fan
        unique_id: switch_timer_test_fan
        state: "{{ is_state('input_boolean.test_fan', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_fan
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.test_fan
