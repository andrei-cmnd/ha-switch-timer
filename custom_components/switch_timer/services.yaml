start:
  target:
    entity:
      - integration: switch_timer
      - domain:
          - switch
          - light
          - fan
          - input_boolean
  fields:
    minutes:
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box

