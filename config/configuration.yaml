# Home Assistant dev instance used by scripts/develop.
# Explicit list instead of default_config: its go2rtc/stream parts need binaries
# that are not in the dev container.
automation:
blueprint:
config:
frontend:
history:
logbook:
my:
script:
search:
system_health:
timer:
input_number:

logger:
  default: info
  logs:
    custom_components.switch_timer: debug

# Test devices to control with Switch Timer.
input_boolean:
  test_pump:
    name: Test pump state
    icon: mdi:water-pump

template:
  - switch:
      - name: Test pump
        unique_id: switch_timer_dev_test_pump
        state: "{{ is_state('input_boolean.test_pump', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_pump
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.test_pump
