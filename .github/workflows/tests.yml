name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements_test.txt
      - run: >-
          python -m pytest
          --cov=custom_components.switch_timer
          --cov-report=term-missing
          --cov-fail-under=95
